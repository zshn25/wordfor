[package]
name = "wordfor-core"
version = "0.1.0"
edition = "2021"

[features]
default = ["potion"]
onnx = ["dep:ort", "dep:ndarray"]
potion = ["dep:tokenizers", "dep:safetensors", "dep:half"]
mmap = ["dep:memmap2"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }

# ONNX Runtime (full-mode query encoding)
ort = { version = "2.0.0-rc.12", optional = true }
ndarray = { version = "0.16", optional = true }

# Potion / Model2Vec (lite-mode query encoding)
tokenizers = { version = "0.21", default-features = false, features = ["onig"], optional = true }
safetensors = { version = "0.5", optional = true }
half = { version = "2", features = ["num-traits"], optional = true }

# Memory-mapped files
memmap2 = { version = "0.9", optional = true }

# Benchmarks (install MinGW or use MSVC target for criterion on Windows)
# [dev-dependencies]
# criterion = { version = "0.5", features = ["html_reports"] }

# [[bench]]
# name = "scoring"
# harness = false
